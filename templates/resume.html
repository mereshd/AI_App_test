<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .resume-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 400px;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .output-box {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow-y: auto;
            min-height: 400px;
        }

        .output-box.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .output-box.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        button {
            background-color: #667eea;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        button:hover:not(:disabled) {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #f5c6cb;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .parsed-content {
            line-height: 1.6;
            color: #333;
        }

        .parsed-content h2 {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .parsed-content h3 {
            color: #764ba2;
            margin-top: 15px;
        }

        .parsed-content ul {
            margin: 10px 0;
            padding-left: 25px;
        }

        .parsed-content li {
            margin: 5px 0;
        }

        /* Input tabs styling */
        .input-tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            margin: 0;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #667eea;
            transform: none;
            box-shadow: none;
            background: none;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .input-option {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .input-option.active {
            display: flex;
        }

        .file-upload-area {
            flex: 1;
            border: 2px dashed #e9ecef;
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .file-upload-area:hover {
            border-color: #667eea;
        }

        .file-info {
            color: #888;
            margin-top: 15px;
        }

        .selected-file-name {
            margin-top: 10px;
            font-weight: bold;
            color: #667eea;
        }

        @media (max-width: 900px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <a href="/" class="nav-link">&larr; Back to Home</a>
        <h1>Resume Parser</h1>
        <p class="subtitle">Paste HTML from LinkedIn or your resume and get a cleaned, formatted version</p>

        <div class="content-wrapper">
            <div class="input-section">
                <div class="section-title">Input Options</div>
                <div class="input-tabs">
                    <button class="tab-btn active" id="html-tab">HTML</button>
                    <button class="tab-btn" id="file-tab">File Upload</button>
                </div>
                <div id="html-input-container" class="input-option active">
                    <textarea
                        id="html-input"
                        placeholder="Paste your LinkedIn profile HTML or resume HTML here...&#10;&#10;Tip: On LinkedIn, right-click on your profile section and select 'Inspect' or 'View Page Source' to copy the HTML."
                    ></textarea>
                </div>
                <div id="file-input-container" class="input-option">
                    <div class="file-upload-area">
                        <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png" />
                        <p class="file-info">Supported formats: PDF, JPG, PNG</p>
                        <p class="selected-file-name"></p>
                    </div>
                </div>
                <button id="parse-btn" onclick="parseResume()">Parse Resume</button>
            </div>

            <div class="output-section">
                <div class="section-title">Parsed Output</div>
                <div id="output-box" class="output-box empty">
                    Parsed resume will appear here...
                </div>
                <div class="button-group" id="action-buttons" style="display: none;">
                    <button onclick="copyToClipboard()">Copy to Clipboard</button>
                    <button onclick="clearAll()">Clear</button>
                </div>
            </div>
        </div>

        <div id="error-container"></div>
    </div>

    <script>
        const htmlInput = document.getElementById('html-input');
        const fileInput = document.getElementById('file-input');
        const htmlTab = document.getElementById('html-tab');
        const fileTab = document.getElementById('file-tab');
        const htmlInputContainer = document.getElementById('html-input-container');
        const fileInputContainer = document.getElementById('file-input-container');
        const selectedFileName = document.querySelector('.selected-file-name');
        const outputBox = document.getElementById('output-box');
        const parseBtn = document.getElementById('parse-btn');
        const actionButtons = document.getElementById('action-buttons');
        const errorContainer = document.getElementById('error-container');
        let parsedText = '';
        let activeInputType = 'html'; // Default input type

        // Setup tab switching
        htmlTab.addEventListener('click', () => switchTab('html'));
        fileTab.addEventListener('click', () => switchTab('file'));

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                selectedFileName.textContent = file.name;

                // Validate file type
                const validTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png'];
                if (!validTypes.includes(file.type)) {
                    showError('Unsupported file type. Please upload a PDF or image file (jpg, jpeg, png).');
                    fileInput.value = '';
                    selectedFileName.textContent = '';
                }
            } else {
                selectedFileName.textContent = '';
            }
        });

        function switchTab(tabType) {
            activeInputType = tabType;

            if (tabType === 'html') {
                htmlTab.classList.add('active');
                fileTab.classList.remove('active');
                htmlInputContainer.classList.add('active');
                fileInputContainer.classList.remove('active');
            } else {
                fileTab.classList.add('active');
                htmlTab.classList.remove('active');
                fileInputContainer.classList.add('active');
                htmlInputContainer.classList.remove('active');
            }
        }

        async function parseResume() {
            // Clear any previous errors
            errorContainer.innerHTML = '';

            // Update UI to loading state
            outputBox.className = 'output-box loading';
            outputBox.innerHTML = 'Parsing resume<span class="loading-dots"></span>';
            parseBtn.disabled = true;
            actionButtons.style.display = 'none';

            try {
                let response;

                if (activeInputType === 'html') {
                    const htmlContent = htmlInput.value.trim();

                    if (!htmlContent) {
                        showError('Please paste some HTML content to parse.');
                        resetOutputBox();
                        return;
                    }

                    response = await fetch('/api/parse-resume', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ html_content: htmlContent })
                    });
                } else {
                    // File upload case
                    if (!fileInput.files || fileInput.files.length === 0) {
                        showError('Please select a file to upload.');
                        resetOutputBox();
                        return;
                    }

                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);

                    response = await fetch('/api/parse-resume', {
                        method: 'POST',
                        body: formData
                    });
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    resetOutputBox();
                } else {
                    parsedText = data.parsed_resume;
                    displayParsedResume(parsedText);
                    actionButtons.style.display = 'flex';
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to parse resume. Please check your input and try again.');
                resetOutputBox();
            } finally {
                parseBtn.disabled = false;
            }
        }

        function resetOutputBox() {
            outputBox.className = 'output-box empty';
            outputBox.innerHTML = 'Parsed resume will appear here...';
        }

        function displayParsedResume(content) {
            outputBox.className = 'output-box';

            // Convert markdown-like formatting to HTML
            let formattedContent = content
                .replace(/\n/g, '<br>')
                .replace(/## (.*?)<br>/g, '<h2>$1</h2>')
                .replace(/### (.*?)<br>/g, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');

            outputBox.innerHTML = `<div class="parsed-content">${formattedContent}</div>`;
        }

        function showError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        async function copyToClipboard() {
            if (!parsedText) return;

            try {
                await navigator.clipboard.writeText(parsedText);
                // Temporarily change button text
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            } catch (error) {
                showError('Failed to copy to clipboard');
            }
        }

        function clearAll() {
            htmlInput.value = '';
            fileInput.value = '';
            selectedFileName.textContent = '';
            outputBox.className = 'output-box empty';
            outputBox.innerHTML = 'Parsed resume will appear here...';
            actionButtons.style.display = 'none';
            parsedText = '';
            errorContainer.innerHTML = '';
        }

        // Allow Enter+Ctrl/Cmd to submit
        htmlInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                parseResume();
            }
        });

        // Focus on input when page loads
        htmlInput.focus();
    </script>
</body>
</html>
