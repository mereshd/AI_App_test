<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .resume-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background-color: #f8f9fa;
            color: #667eea;
            border: 2px solid #e9ecef;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .tab-btn.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-btn:hover {
            background-color: #764ba2;
            color: white;
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 400px;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .file-upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px dashed #e9ecef;
            border-radius: 15px;
            padding: 40px;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 400px;
        }

        .file-upload-area:hover {
            border-color: #667eea;
            background-color: #fff;
        }

        .file-upload-area.dragover {
            border-color: #667eea;
            background-color: #e7f0ff;
        }

        .upload-icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 18px;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
        }

        .upload-subtext {
            font-size: 14px;
            color: #999;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .selected-file {
            margin-top: 20px;
            padding: 15px;
            background-color: #e7f0ff;
            border-radius: 10px;
            color: #667eea;
            font-weight: 600;
            text-align: center;
        }

        .output-box {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow-y: auto;
            min-height: 400px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
        }

        .output-box.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .output-box.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        button {
            background-color: #667eea;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
            font-size: 16px;
        }

        button:hover:not(:disabled) {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #c3e6cb;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (max-width: 900px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <a href="/" class="nav-link">&larr; Back to Home</a>
        <h1>Resume Parser</h1>
        <p class="subtitle">Parse resumes from HTML text or upload Image/PDF files</p>

        <div class="content-wrapper">
            <div class="input-section">
                <div class="section-title">Input Options</div>
                
                <!-- Tab selection -->
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('html')">HTML Text</button>
                    <button class="tab-btn" onclick="switchTab('file')">Upload File</button>
                </div>
                
                <!-- HTML text input -->
                <div id="html-tab" class="tab-content active">
                    <textarea
                        id="html-input"
                        placeholder="Paste your LinkedIn profile HTML or resume HTML here...

Tip: On LinkedIn, right-click and select 'View Page Source' to copy the HTML."
                    ></textarea>
                </div>
                
                <!-- File upload (handles both images and PDFs) -->
                <div id="file-tab" class="tab-content">
                    <div class="file-upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">Click to upload or drag and drop</div>
                        <div class="upload-subtext">Supports: PDF, PNG, JPG, JPEG</div>
                        <div id="selectedFileName" class="selected-file" style="display: none;"></div>
                    </div>
                    <input 
                        type="file" 
                        id="fileInput" 
                        class="file-input" 
                        accept="application/pdf,image/png,image/jpeg,image/jpg"
                        onchange="handleFileSelect(event)"
                    >
                </div>
                
                <button id="parse-btn" onclick="parseResume()">Parse Resume</button>
            </div>

            <div class="output-section">
                <div class="section-title">Parsed Output</div>
                <div id="output-box" class="output-box empty">
                    Parsed resume will appear here...
                </div>
                <div class="button-group" id="action-buttons" style="display: none;">
                    <button onclick="copyToClipboard()">Copy to Clipboard</button>
                    <button onclick="clearAll()">Clear</button>
                </div>
            </div>
        </div>

        <div id="error-container"></div>
    </div>

    <script>
        let currentTab = 'html';
        let selectedFile = null;
        let parsedData = null;

        const htmlInput = document.getElementById('html-input');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const selectedFileName = document.getElementById('selectedFileName');
        const outputBox = document.getElementById('output-box');
        const parseBtn = document.getElementById('parse-btn');
        const actionButtons = document.getElementById('action-buttons');
        const errorContainer = document.getElementById('error-container');

        function switchTab(tab) {
            currentTab = tab;
            
            // Update button styles
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Show/hide content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
            
            // Reset selected file when switching tabs
            selectedFile = null;
        }

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect({ target: { files: files } });
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                selectedFileName.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                selectedFileName.style.display = 'block';
                
                // Update icon based on file type
                const icon = file.type.startsWith('image/') ? '🖼️' : '📄';
                document.querySelector('.upload-icon').textContent = icon;
                
                errorContainer.innerHTML = '';
            }
        }

        async function parseResume() {
            errorContainer.innerHTML = '';
            
            try {
                let response;
                
                if (currentTab === 'html') {
                    // Send HTML as JSON
                    const htmlContent = htmlInput.value.trim();
                    if (!htmlContent) {
                        showError('Please paste HTML content');
                        return;
                    }
                    
                    outputBox.className = 'output-box loading';
                    outputBox.innerHTML = 'Parsing resume<span class="loading-dots"></span>';
                    parseBtn.disabled = true;
                    actionButtons.style.display = 'none';
                    
                    response = await fetch('/api/parse-resume', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ html_content: htmlContent })
                    });
                }
                else {
                    // Send file via FormData
                    if (!selectedFile) {
                        showError('Please select a file first');
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('file', selectedFile);
                    
                    outputBox.className = 'output-box loading';
                    outputBox.innerHTML = 'Parsing resume<span class="loading-dots"></span>';
                    parseBtn.disabled = true;
                    actionButtons.style.display = 'none';
                    
                    response = await fetch('/api/parse-resume', {
                        method: 'POST',
                        body: formData
                    });
                }

                const data = await response.json();
                console.log('API Response:', data);

                if (data.error) {
                    showError(data.error);
                    outputBox.className = 'output-box empty';
                    outputBox.innerHTML = 'Parsed resume will appear here...';
                } else if (data.parsed_resume) {
                    parsedData = data.parsed_resume;
                    outputBox.className = 'output-box';
                    outputBox.textContent = JSON.stringify(data.parsed_resume, null, 2);
                    actionButtons.style.display = 'flex';
                    
                    if (data.insert_result && data.insert_result.success) {
                        showSuccess('Resume parsed and saved to database!');
                    }
                } else {
                    showError('Unexpected response format from server');
                    outputBox.className = 'output-box empty';
                    outputBox.innerHTML = 'Parsed resume will appear here...';
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Failed to parse resume: ${error.message}`);
                outputBox.className = 'output-box empty';
                outputBox.innerHTML = 'Parsed resume will appear here...';
            } finally {
                parseBtn.disabled = false;
            }
        }

        function showError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => errorContainer.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            errorContainer.innerHTML = `<div class="success-message">${message}</div>`;
            setTimeout(() => errorContainer.innerHTML = '', 5000);
        }

        async function copyToClipboard() {
            if (!parsedData) return;
            try {
                const jsonString = JSON.stringify(parsedData, null, 2);
                await navigator.clipboard.writeText(jsonString);
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            } catch (error) {
                showError('Failed to copy to clipboard');
            }
        }

        function clearAll() {
            htmlInput.value = '';
            fileInput.value = '';
            selectedFile = null;
            selectedFileName.style.display = 'none';
            document.querySelector('.upload-icon').textContent = '📄';
            outputBox.className = 'output-box empty';
            outputBox.innerHTML = 'Parsed resume will appear here...';
            actionButtons.style.display = 'none';
            parsedData = null;
            errorContainer.innerHTML = '';
        }

        // Keyboard shortcut for HTML tab
        htmlInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                parseResume();
            }
        });

        htmlInput.focus();
    </script>
</body>
</html>
