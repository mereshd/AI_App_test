<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .resume-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 400px;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .output-box {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow-y: auto;
            min-height: 400px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-box.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .output-box.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        button {
            background-color: #667eea;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        button:hover:not(:disabled) {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #c3e6cb;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (max-width: 900px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <a href="/" class="nav-link">&larr; Back to Home</a>
        <h1>Resume Parser</h1>
        <p class="subtitle">Paste HTML from LinkedIn or your resume and get a cleaned, formatted version</p>

        <div class="content-wrapper">
            <div class="input-section">
                <div class="section-title">Input HTML</div>
                <textarea
                    id="html-input"
                    placeholder="Paste your LinkedIn profile HTML or resume HTML here...&#10;&#10;Tip: On LinkedIn, right-click on your profile section and select 'Inspect' or 'View Page Source' to copy the HTML."
                ></textarea>
                <button id="parse-btn" onclick="parseResume()">Parse Resume</button>
            </div>

            <div class="output-section">
                <div class="section-title">Parsed Output</div>
                <div id="output-box" class="output-box empty">
                    Parsed resume will appear here...
                </div>
                <div class="button-group" id="action-buttons" style="display: none;">
                    <button onclick="copyToClipboard()">Copy to Clipboard</button>
                    <button onclick="clearAll()">Clear</button>
                </div>
            </div>
        </div>

        <div id="error-container"></div>
    </div>

    <script>
        const htmlInput = document.getElementById('html-input');
        const outputBox = document.getElementById('output-box');
        const parseBtn = document.getElementById('parse-btn');
        const actionButtons = document.getElementById('action-buttons');
        const errorContainer = document.getElementById('error-container');
        let parsedData = null;

        async function parseResume() {
            const htmlContent = htmlInput.value.trim();

            if (!htmlContent) {
                showError('Please paste some HTML content to parse.');
                return;
            }

            // Clear any previous messages
            errorContainer.innerHTML = '';

            // Update UI to loading state
            outputBox.className = 'output-box loading';
            outputBox.innerHTML = 'Parsing resume<span class="loading-dots"></span>';
            parseBtn.disabled = true;
            actionButtons.style.display = 'none';

            try {
                const response = await fetch('/api/parse-resume', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ html_content: htmlContent })
                });

                const data = await response.json();
                console.log('API Response:', data);

                if (data.error) {
                    showError(data.error);
                    outputBox.className = 'output-box empty';
                    outputBox.innerHTML = 'Parsed resume will appear here...';
                } else if (data.parsed_resume) {
                    parsedData = data.parsed_resume;
                    
                    // Display raw JSON
                    outputBox.className = 'output-box';
                    outputBox.textContent = JSON.stringify(data.parsed_resume, null, 2);
                    
                    actionButtons.style.display = 'flex';
                    
                    // Show success message if saved to database
                    if (data.insert_result && data.insert_result.success) {
                        showSuccess('Resume parsed and saved to database!');
                    }
                } else {
                    showError('Unexpected response format from server');
                    outputBox.className = 'output-box empty';
                    outputBox.innerHTML = 'Parsed resume will appear here...';
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Failed to parse resume: ${error.message}`);
                outputBox.className = 'output-box empty';
                outputBox.innerHTML = 'Parsed resume will appear here...';
            } finally {
                parseBtn.disabled = false;
            }
        }

        function showError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function showSuccess(message) {
            errorContainer.innerHTML = `<div class="success-message">${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        async function copyToClipboard() {
            if (!parsedData) return;

            try {
                const jsonString = JSON.stringify(parsedData, null, 2);
                await navigator.clipboard.writeText(jsonString);
                
                // Temporarily change button text
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            } catch (error) {
                showError('Failed to copy to clipboard');
            }
        }

        function clearAll() {
            htmlInput.value = '';
            outputBox.className = 'output-box empty';
            outputBox.innerHTML = 'Parsed resume will appear here...';
            actionButtons.style.display = 'none';
            parsedData = null;
            errorContainer.innerHTML = '';
        }

        // Allow Enter+Ctrl/Cmd to submit
        htmlInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                parseResume();
            }
        });

        // Focus on input when page loads
        htmlInput.focus();
    </script>
</body>
</html>
